name: Verify game

on:
  push:
    branches: [main, feat/architectural-command-gameplay]
  pull_request:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    # The full suite now runs engine + smoke + UI + character-lifecycle + deployment-entity
    # browser tests sequentially under software WebGL (slow by design), ~10 min; 20 gives headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: tools/shots/
          retention-days: 7
